version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: frp-postgres
    environment:
      POSTGRES_USER: frpuser
      POSTGRES_PASSWORD: frppass
      POSTGRES_DB: frpcore
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frpuser -d frpcore"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: frp-timescaledb
    environment:
      POSTGRES_USER: frpuser
      POSTGRES_PASSWORD: frppass
      POSTGRES_DB: frpmetrics
    volumes:
      - timescale_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    depends_on:
      - postgres

  fastapi:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: frp-api
    environment:
      DATABASE_URL: postgresql://frpuser:frppass@postgres:5432/frpcore
      METRICS_URL: postgresql://frpuser:frppass@timescaledb:5432/frpmetrics
      JWT_SECRET: your-secret-key-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_started
    volumes:
      - ./api:/app

  grafana:
    image: grafana/grafana:latest
    container_name: frp-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - timescaledb

volumes:
  postgres_data:
  timescale_data:
  grafana_data:
